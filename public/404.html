<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ברכת אברהם</title>
    <!--
      GitHub Pages SPA redirect (rtlib/spa-github-pages).
      GH Pages has no server-side routing, so a deep link like /birkat-avraham/admin
      404s. This redirects to the app root while preserving the intended path, and
      index.html restores it. pathSegmentsToKeep = 1 keeps the /birkat-avraham/ base.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
